[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudiamond"
version = "0.0.2"
description = "Security toolkit for Scratch and TurboWarp external integrations."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

authors = [
    { name = "maru-m4ru-maru" }
]

keywords = [
    "scratch",
    "turbowarp",
    "security",
    "cloud-variable",
    "api"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only"
]

[project.urls]
Homepage = "https://github.com/maru-m4ru-maru/ClouDiamond"
Repository = "https://github.com/maru-m4ru-maru/ClouDiamond"
Issues = "https://github.com/maru-m4ru-maru/ClouDiamond/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudiamond"]
